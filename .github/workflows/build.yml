name: Build Java Project

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: maven:3.9.11-eclipse-temurin-21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test
            mvn clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: ./target/*.jar
